name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: uv venv --python 3.14 .venv && uv pip install --python .venv/bin/python --group dev
      - run: make lint TOOLS=.venv/bin

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config
      - run: make setup
        env:
          BENCH_INIT_EXTRA_ARGS: --skip-assets
      - run: make typecheck test
